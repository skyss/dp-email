[project]
name = "dp-email"
version = "0.2.0"
description = "Add your description here"
authors = [{ name = "John Erik Sloper", email = "john.erik.sloper@vlfk.no" }]
dependencies = [
    "azure-identity>=1.17.0",
    "azure-communication-email>=1.0.0",
    "azure-keyvault-secrets>=4.8.0",
    "loguru>=0.7.2",
    "mjml>=0.11.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dp_email"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests...
    "ANN201", # Don't care about type annotations in tests.
    "D100", # Don't care about docstring in tests.
    "D103", # Don't care about docstring in tests.
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant.
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]

[tool.mypy]
python_version = "3.10"
exclude = ["tests"]
