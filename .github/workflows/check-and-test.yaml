name: Code checks and tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Python Setup Rye
        uses: eifinger/setup-rye@v2.5.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: rye sync
      - name: Run pre-commit
        run: rye run pre-commit run --all-files
      - name: Run tests
        run: rye run pytest -v .
